<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>聚餐分帳器</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #19332c; background: #f4f6f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px 48px; }
    main { width: min(100%, 540px); margin: 0 auto; }
    .eyebrow { color: #427762; font-size: .82rem; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 9px 0 8px; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.18; color: #1d4ed8; }
    .intro { color: #60746b; margin: 0 0 24px; line-height: 1.65; }
    .card { background: #fff; border: 1px solid #dce7dc; border-radius: 24px; box-shadow: 0 14px 42px #1c463316; padding: 24px; }
    .field + .field { margin-top: 22px; }
    label { display: block; font-size: .95rem; font-weight: 750; margin-bottom: 9px; }
    .input-wrap { display: flex; align-items: center; border: 2px solid #d8e3d9; border-radius: 14px; background: #fbfcf9; overflow: hidden; transition: border-color .15s; }
    .input-wrap:focus-within { border-color: #247c5b; }
    input[type=number] { width: 100%; min-width: 0; border: 0; outline: 0; padding: 15px 16px; background: transparent; color: #19332c; font: inherit; font-size: 1.25rem; font-weight: 750; }
    .unit { padding: 0 16px; color: #60746b; white-space: nowrap; }
    .check-row { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 17px; border-radius: 14px; background: #eef5ee; cursor: pointer; }
    .check-row input { width: 21px; height: 21px; margin: 0; accent-color: #247c5b; flex: none; }
    .check-row span { font-weight: 750; }
    .hint { margin: 8px 0 0; color: #60746b; font-size: .84rem; line-height: 1.5; }
    .error { min-height: 1.3em; margin: 14px 0 0; color: #b13e36; font-size: .9rem; font-weight: 650; }
    .result { margin-top: 20px; padding: 24px; background: #173e32; color: #fff; border-radius: 24px; }
    .result[hidden] { display: none; }
    .result-title { margin: 0 0 18px; font-size: 1rem; color: #bfe5ce; font-weight: 750; }
    .amount-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #ffffff30; }
    .amount-row strong { font-size: clamp(1.6rem, 6vw, 2.15rem); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .amount-row .who { line-height: 1.45; }
    .amount-row small { display: block; margin-top: 3px; color: #bfe5ce; }
    .summary { margin-top: 15px; padding-top: 16px; border-top: 1px solid #ffffff30; color: #dceee1; line-height: 1.85; font-size: .91rem; }
    .summary div { display: flex; justify-content: space-between; gap: 12px; }
    .summary b { color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .note { margin: 18px 2px 0; color: #60746b; font-size: .83rem; line-height: 1.6; }
    @media (max-width: 430px) { .card, .result { padding: 19px; } .amount-row { gap: 8px; } .amount-row strong { font-size: 1.55rem; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">一起吃飯，清楚分帳</div>
    <h1>聚餐分帳器</h1>
    <p class="intro">輸入餐點金額與人數，立刻算出每人該付多少。所有金額都以新臺幣整數顯示。</p>

    <section class="card" aria-label="分帳設定">
      <div class="field">
        <label for="amount">總金額（未含服務費）</label>
        <div class="input-wrap"><input id="amount" type="number" inputmode="numeric" min="1" max="999999999" step="1" placeholder="例如 1000" autocomplete="off"><span class="unit">元</span></div>
      </div>
      <div class="field">
        <label for="people">用餐人數（含付錢的人）</label>
        <div class="input-wrap"><input id="people" type="number" inputmode="numeric" min="1" max="1000" step="1" placeholder="例如 3" autocomplete="off"><span class="unit">人</span></div>
      </div>
      <label class="check-row" for="service"><input id="service" type="checkbox"><span>加 10% 服務費</span></label>
      <p class="hint">服務費若有小數，四捨五入到整元。</p>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section id="result" class="result" aria-label="分帳結果" aria-live="polite" hidden>
      <p class="result-title">分帳結果</p>
      <div class="amount-row"><span class="who">付錢的人<small id="remainder-note"></small></span><strong id="payer-amount"></strong></div>
      <div class="amount-row"><span class="who" id="others-label">其他人各</span><strong id="other-amount"></strong></div>
      <div class="summary">
        <div><span>餐點金額</span><b id="base-total"></b></div>
        <div><span>服務費</span><b id="service-total"></b></div>
        <div><span>應付總額</span><b id="grand-total"></b></div>
        <div><span>分帳加總</span><b id="check-total"></b></div>
      </div>
    </section>
    <p class="note">此頁可離線使用；輸入只留在目前畫面，不會上傳或儲存。</p>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const amountInput = $('amount');
      const peopleInput = $('people');
      const serviceInput = $('service');
      const format = (n) => `${n.toLocaleString('zh-TW')} 元`;

      function update() {
        const amountText = amountInput.value.trim();
        const peopleText = peopleInput.value.trim();
        $('error').textContent = '';
        $('result').hidden = true;
        if (!amountText || !peopleText) return;

        const amount = Number(amountText);
        const people = Number(peopleText);
        if (!Number.isSafeInteger(amount) || amount < 1 || amount > 999999999) {
          $('error').textContent = '請輸入 1 至 999,999,999 元的整數金額。';
          return;
        }
        if (!Number.isSafeInteger(people) || people < 1 || people > 1000) {
          $('error').textContent = '請輸入 1 至 1,000 人的整數人數。';
          return;
        }

        const serviceFee = serviceInput.checked ? Math.round(amount / 10) : 0;
        const total = amount + serviceFee;
        const eachOther = Math.floor(total / people);
        const remainder = total % people;
        const payer = eachOther + remainder;
        const othersCount = people - 1;

        $('payer-amount').textContent = format(payer);
        $('remainder-note').textContent = remainder ? `含無法平分的 ${remainder} 元零頭` : '沒有零頭';
        $('others-label').textContent = othersCount ? `其他 ${othersCount} 人各` : '其他人（無）';
        $('other-amount').textContent = othersCount ? format(eachOther) : '—';
        $('base-total').textContent = format(amount);
        $('service-total').textContent = format(serviceFee);
        $('grand-total').textContent = format(total);
        $('check-total').textContent = format(payer + eachOther * othersCount);
        $('result').hidden = false;
      }

      amountInput.addEventListener('input', update);
      peopleInput.addEventListener('input', update);
      serviceInput.addEventListener('change', update);
    })();
  </script>
</body>
</html>
